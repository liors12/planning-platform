            $td = Start-Process -FilePath "$env:USERPROFILE\.cargo\bin\tauri-driver.exe" `
              -ArgumentList "--native-driver", $drv -PassThru `
              -RedirectStandardOutput "$env:RUNNER_TEMP\tauri-driver-e.out.log" `
              -RedirectStandardError "$env:RUNNER_TEMP\tauri-driver-e.err.log"
            Start-Sleep -Seconds 3
            $caps = @{ capabilities = @{ alwaysMatch = @{
              "tauri:options" = @{ application = $dexe }
              browserName = "wry"
            } } } | ConvertTo-Json -Depth 6
            $sess = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:4444/session" `
              -ContentType "application/json" -Body $caps -TimeoutSec 120
            $sid = $sess.value.sessionId
            $title = (Invoke-RestMethod -Uri "http://127.0.0.1:4444/session/$sid/title" -TimeoutSec 30).value
            Write-Host "ATTEMPT-E: ATTACH OK — window title = [$title]"
            Invoke-RestMethod -Method Delete -Uri "http://127.0.0.1:4444/session/$sid" -TimeoutSec 30 | Out-Null
            Stop-Process -Id $td.Id -Force -ErrorAction SilentlyContinue
            exit 0
          } catch {
            Write-Host "ATTEMPT-E: FAILED — $($_.Exception.Message)"
            Get-Content "$env:RUNNER_TEMP\tauri-driver-e.out.log" -Tail 15 -ErrorAction SilentlyContinue | Write-Host
            Get-Content "$env:RUNNER_TEMP\tauri-driver-e.err.log" -Tail 15 -ErrorAction SilentlyContinue | Write-Host
            Write-Host "::warning::Attempt E probe failed (diagnostic, non-fatal)"
            exit 0
          }

      - name: UI smoke — uninstall app after test
        if: always()
        shell: pwsh
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA "Planning Platform"
          $uninstaller = Join-Path $installDir "uninstall.exe"
          if (Test-Path $uninstaller) {
            Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait
            Start-Sleep -Seconds 3
          }

      - name: UI smoke — upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-report
          path: |
            tests/e2e-ui/playwright-report/**
            tests/e2e-ui/test-results/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ness-ziona-installer-windows
          path: app/tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
          if-no-files-found: error

      - name: Compute release tag + title
        # Release steps are gated to main/tags: a branch dispatch (e.g. the
        # QA campaign) must never delete/replace the released installer.
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        # Tag form: v<version>-<UTC-date>-<short-sha>, e.g.
        # v0.1.0-20260612-4dee986. We pull <version> from tauri.conf.json so
        # bumping the app version in one place flows through to the tag.
        # Outputs go to $GITHUB_ENV so the next step can read them.
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -oE '"version": *"[^"]+"' app/tauri/tauri.conf.json \
                    | head -1 | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          short=$(git rev-parse --short HEAD)
          date_utc=$(date -u +%Y%m%d)
          date_display=$(date -u +%Y-%m-%d)
          tag="v${version}-${date_utc}-${short}"
          title="Planning Platform — Build ${date_display}"
          echo "RELEASE_TAG=${tag}"     >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=${title}" >> "$GITHUB_ENV"
          # B-10: version also exported standalone - the upload glob is
          # scoped to it so cached older installers can't attach.
          echo "APP_VERSION=${version}" >> "$GITHUB_ENV"
          echo "Tag:   ${tag}"
          echo "Title: ${title}"

      - name: Delete previous build releases
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        # Each successful build cuts a new prerelease tagged
        # v0.1.0-<date>-<sha>. Without cleanup the releases page grows
        # one entry per build — confusing for Ellen, who only ever wants
        # the latest installer. Loop through every v0.1.0-* release and
        # delete it (and its tag) BEFORE softprops creates the new one,
        # so the page always shows exactly one prerelease at the top.
        # `|| true` on each delete so a partially-cleaned-up release
        # (e.g. tag exists but release doesn't) doesn't fail the job.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          # B-10 follow-through: the filter was hardcoded to v0.1.0-* and
          # stopped cleaning anything after the version bump. Match every
          # build tag (v<semver>-<date>-<sha>) except the one this run is
          # about to create.
          tags=$(gh release list --json tagName --jq '.[].tagName' \
                 | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+-" \
                 | grep -vx "${RELEASE_TAG}" || true)
          if [ -z "$tags" ]; then
            echo "No prior build releases found; nothing to clean."
            exit 0
          fi
          echo "Deleting prior prereleases:"
          echo "$tags"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "  - $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          done <<< "$tags"

      - name: Create GitHub Release (pre-release)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        # Pre-release while we're still iterating on the pilot — the badge on
        # the releases page reads "Pre-release" so Ellen knows this isn't a
        # stamped 1.0. softprops/action-gh-release creates the git tag for
        # us; needs `contents: write` on the job (set at workflow root).
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          # Hebrew install instructions for Ellen. Three lines: where to
          # click, what to expect, and what to do when SmartScreen
          # flags the unsigned binary on first launch.
          body: |
            📥 להורדת קובץ ההתקנה, לחצי על הקובץ למטה.
            הפעילי את הקובץ שירד — אין צורך בהרשאות מנהל.

            אם מופיעה הודעת "Windows protected your PC" — לחצי על "More info" ואז "Run anyway".
          # B-10: scoped to THIS build's version (from tauri.conf.json via
          # APP_VERSION) so a cached older installer can never ride along.
          files: app/tauri/target/release/bundle/nsis/*_${{ env.APP_VERSION }}_*-setup.exe
          # Full release (not prerelease) so /releases/latest resolves to it -
          # that's the stable link Ellen uses.
          prerelease: false
          fail_on_unmatched_files: true
