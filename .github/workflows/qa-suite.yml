# QA campaign — permanent 5-layer suite (split model).
# Layer 0 gates (em-dash + jargon) + Layers 1-3 (state/error, viewport
# matrix, screenshots) + core flows F1-F6, against the Vite dev server and
# the real sidecar with a fresh seeded DB. The packaged bundle stays covered
# by build-windows.yml's API probes.
name: QA Suite (dev-server UI)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'compliance_engine/**'
      - 'tests/**'
      - 'qa/**'
      - '.github/workflows/qa-suite.yml'
  pull_request:
    branches: [main]

jobs:
  layer0-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '20', cache: 'npm', cache-dependency-path: app/frontend/package-lock.json }
      - name: Frontend deps (esbuild, for the bidi Python/TS parity gate)
        run: npm --prefix app/frontend ci --no-audit --no-fund
      - name: Run convention gates (em-dash + jargon + anchors + check keys + chrome + bidi)
        run: |
          # python-docx: test_check_mode_structural imports the extraction
          # script, which parses the source docx. Without it the gate errors
          # on import and reports a failure that is not a convention breach.
          pip install --quiet -c app/sidecar/requirements-linux.txt pytest python-docx pyyaml uv
          python -m pytest tests/test_no_emdash.py tests/test_jargon_lexicon.py \
                           tests/test_no_download_anchor.py \
                           tests/test_check_key_attachment.py \
                           tests/test_check_mode_structural.py \
                           tests/test_report_chrome_shared.py \
                           tests/test_bidi_isolation.py \
                           tests/test_release_safety.py \
                           tests/test_version_agreement.py \
                           tests/test_ui_smoke_verdict.py \
                           tests/test_dependency_lock.py -q

  ui-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12', cache: 'pip', cache-dependency-path: app/sidecar/requirements-linux.txt }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '20', cache: 'npm', cache-dependency-path: app/frontend/package-lock.json }

      - name: System deps (WeasyPrint pango stack + fonts)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-noto-core

      - name: Python deps (sidecar + engine, no sqlcipher on CI)
        run: |
          # The Linux lock: runtime + CI test tools, exact versions. sqlcipher3
          # needs the system SQLCipher library, which the runner does not have.
          grep -v "^sqlcipher3" app/sidecar/requirements-linux.txt > /tmp/reqs.txt
          pip install --quiet -r /tmp/reqs.txt

      - name: Frontend deps
        run: npm --prefix app/frontend ci --no-audit --no-fund

      - name: Playwright
        working-directory: tests/ui-dev
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the 5-layer suite
        working-directory: tests/ui-dev
        env:
          PLATFORM_PYTHON: python3
          QA_SUITE_PYTHON: python3
        run: npx playwright test

      - name: Upload screenshots (Layer 3 artifacts)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-suite-screenshots
          path: tests/ui-dev/screenshots/**
          if-no-files-found: warn
          retention-days: 30

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-suite-traces
          path: tests/ui-dev/test-results/**
          if-no-files-found: ignore
          retention-days: 14
